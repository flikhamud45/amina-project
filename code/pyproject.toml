[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pvi"
version = "2.0.0"
description = "Proofs of inference: an attack on spot-checking verifiers and a fully sound defence"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

# Exact versions the reported results were produced with are in
# requirements.txt; the ranges above are what the code needs to import.
[project.optional-dependencies]
dev = ["pytest>=8.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 120
src = ["src", "tests", "."]

[tool.ruff.lint]
select = ["E9", "F", "PLE2510", "PLE2512", "PLE2513", "PLE2514", "PLE2515"]   # syntax, pyflakes, control characters

[tool.ruff.lint.isort]
known-first-party = ["pvi"]
